aid: skyspecs
name: SkySpecs
description: >-
  SkySpecs is a renewable energy asset management company based in Ann Arbor,
  Michigan that combines autonomous drone inspections, condition-monitoring
  hardware, and its cloud-based Horizon software platform to help wind and solar
  operators manage the health and performance of their assets. Horizon
  consolidates blade inspection imagery, drivetrain and sensor data, SCADA-based
  performance analytics, repair-vendor coordination, and financial reporting
  into one hub, with third-party data ingestion and custom integrations for
  fleet owners. The company reports assets under contract across six countries
  and is backed by Goldman Sachs Asset Management. SkySpecs exposes no public
  developer API, SDK, or self-serve developer portal today; integrations are
  arranged directly with the Horizon team.
